zerops:
  - setup: java

    build:
      base: alpine/java@21

      buildCommands:
        - cd zerops-copilot && ./mvnw clean package -DskipTests

      deployFiles:
        - zerops-copilot/target/*.jar

    run:
      base: alpine/java@21

      ports:
        - port: 8080
          httpSupport: true

      envVariables:
        SPRING_DATASOURCE_PASSWORD: ${db_password}
        SPRING_DATASOURCE_URL: jdbc:postgresql://${db_hostname}:5432/${db_dbName}
        SPRING_DATASOURCE_USERNAME: ${db_user}

      start: java -jar zerops-copilot/target/*.jar