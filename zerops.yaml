zerops:
  - setup: ui

    build:
      base: nodejs@22

      buildCommands:
        - cd zerops-copilot-ui && npm install
        - cd zerops-copilot-ui && node node_modules/typescript/bin/tsc
        - cd zerops-copilot-ui && node node_modules/vite/bin/vite.js build

      deployFiles:
        - ./zerops-copilot-ui/dist

    run:
      base: static