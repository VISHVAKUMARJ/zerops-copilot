zerops:
  - setup: ai

    build:
      base: python@3.12

      deployFiles:
        - ./zerops-copilot-ai/app
        - ./zerops-copilot-ai/requirements.txt

      addToRunPrepare:
        - ./zerops-copilot-ai/requirements.txt

    run:
      base: python@3.12

      prepareCommands:
        - cd zerops-copilot-ai && pip install --no-cache-dir -r requirements.txt

      ports:
        - port: 8000
          httpSupport: true

      start: cd zerops-copilot-ai && uvicorn app.main:app --host 0.0.0.0 --port 8000