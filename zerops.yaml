zerops:
  - setup: ai

    build:
      base: python@3.12

      addToRunPrepare:
        - ./zerops-copilot-ai/requirements.txt

      deployFiles:
        - ./zerops-copilot-ai/app
        - ./zerops-copilot-ai/requirements.txt

    run:
      base: python@3.12

      prepareCommands:
        - pip install --no-cache-dir -r requirements.txt

      ports:
        - port: 8000
          protocol: TCP
          httpSupport: true

      start: cd /var/www/zerops-copilot-ai && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000