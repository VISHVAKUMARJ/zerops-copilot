zerops:
  - setup: java

    build:
      base: java@21

      prepareCommands:
        - zsc add maven

      buildCommands:
        - cd zerops-copilot
        - mvn clean package -DskipTests

      deployFiles:
        - zerops-copilot/target/*.jar

    run:
      base: java@21

      ports:
        - port: 8080
          httpSupport: true

      envVariables:
        SPRING_DATASOURCE_URL: jdbc:postgresql://${db_hostname}:5432/${db_dbName}
        SPRING_DATASOURCE_USERNAME: ${db_user}
        SPRING_DATASOURCE_PASSWORD: ${db_password}

      start: java -jar zerops-copilot/target/*.jar