zerops:
  - setup: java

    build:
      base: alpine/java@21

      prepareCommands:
        - zsc add maven

      buildCommands:
        - cd zerops-copilot
        - mvn clean package -DskipTests

      deployFiles:
        - zerops-copilot/target/*.jar

    run:
      base: alpine/java@21

      ports:
        - port: 8080
          httpSupport: true

      envVariables:
        SPRING_DATASOURCE_URL: jdbc:postgresql://${postgresql_hostname}:5432/${postgresql_dbName}
        SPRING_DATASOURCE_USERNAME: ${postgresql_user}
        SPRING_DATASOURCE_PASSWORD: ${postgresql_password}

      start: java -jar zerops-copilot/target/*.jar